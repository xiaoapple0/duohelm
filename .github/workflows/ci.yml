name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 只取消 PR 上被新推送替代的运行。main 上的运行必须跑完：发版要求"CI 跑绿"，被取消的运行不算通过。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest -rs

  # 在非东八区时区下再跑一遍测试：行情日期必须由时间戳按 Asia/Shanghai 换算，
  # 不能依赖本机时区（xtdata 的日期字符串在美东时区下会早一天，见 LESSONS.md）。
  python-timezone:
    name: Python (ubuntu-latest, TZ=America/New_York)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Check time zone
        # 确认时区真的生效：美东是 -0500（冬令时）或 -0400（夏令时）
        run: uv run python -c "import time; z = time.strftime('%z'); print(z); assert z in ('-0500', '-0400'), z"
      - name: Pytest
        run: uv run pytest -rs

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build
