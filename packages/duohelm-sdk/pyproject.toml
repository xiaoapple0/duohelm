[project]
name = "duohelm-sdk"
version = "0.4.2"
description = "DuoHelm 插件 SDK：插件接口、清单格式、契约检查"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
    "packaging>=23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duohelm_sdk"]
