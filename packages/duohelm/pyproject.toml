[project]
name = "duohelm"
version = "0.1.0"
description = "舵手 DuoHelm：人与 AI 共同掌舵的因子研究与交易平台"
requires-python = ">=3.12"
dependencies = [
    "duohelm-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
duohelm = "duohelm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duohelm"]
